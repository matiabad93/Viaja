name: Viaja v1 staging checks
on:
  push:
    branches: [feat/v1-production-release-plan, fix/map-and-budget-ux-20261029, feat/multidestination-route-budget-ux-20261030]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --noEmit
      - run: pnpm run test:core
      - run: node --experimental-strip-types tests/date-range.test.mts
      - run: node --experimental-strip-types tests/social-auth.test.mts
      - run: node --experimental-strip-types tests/gemini-adapter.test.mts
      - run: node --experimental-strip-types tests/trip-pdf.test.mts
      - run: node --experimental-strip-types tests/calendar-map.test.mts
      - run: node --experimental-strip-types tests/photos-quality.test.mts
      - run: node --experimental-strip-types tests/tourism-photos.test.mts
      - run: node --experimental-strip-types tests/multidestinations.test.mts
      - run: node --experimental-strip-types tests/destinations.test.mts
      - run: node --experimental-strip-types tests/city-autocomplete.test.mts
      - run: node --experimental-strip-types tests/v1-ux.test.mts
      - run: pnpm run build:demo
      - name: Require actual production output
        run: test -f web-dist/index.html

  pages-npm-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exactly as Cloudflare Pages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build with Cloudflare Pages command
        run: npm run build:demo
      - name: Check built app entry point
        run: test -f web-dist/index.html

  mobile-ui-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build:demo
      - name: Prepare headless browser
        run: |
          command -v google-chrome
          npm install --prefix /tmp/viaja-smoke --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Serve compiled web build
        run: |
          nohup pnpm exec vite preview --config vite.portable.config.ts --host 127.0.0.1 --port 4173 > /tmp/viaja-vite-preview.log 2>&1 &
          for attempt in $(seq 1 45); do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi; sleep 1; done
          cat /tmp/viaja-vite-preview.log
          exit 1
      - name: Test mobile and desktop journey UX
        run: node scripts/v1-mobile-ux-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Viaja-V1-Mobile-UX
          path: artifacts/v1-mobile-ux/
          retention-days: 7
