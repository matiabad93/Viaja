name: Viaja v1 staging checks
on:
  push:
    branches: [feat/v1-production-release-plan]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  web-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable && corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec tsc --noEmit
      - run: pnpm run test:core
      - run: node --experimental-strip-types tests/social-auth.test.mts
      - run: pnpm run build:demo
      - name: Require actual production output
        run: test -f web-dist/index.html
