name: Tupã Travel Premium v1 checks
on:
  push:
    branches:
      - demo/tupa-travel
      - tupa-travel-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tupa-v1-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Tupã Travel premium app isolation
        run: node --experimental-strip-types tests/tupa-demo.test.mts
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Compile for Cloudflare Pages
        run: npm run build:demo
      - name: Validate output
        run: |
          test -f web-dist/index.html
          test -f web-dist/tupa-premium-emblem.svg
          grep -q 'Tupã Travel' web-dist/index.html
      - name: Chromium browser smoke
        run: |
          npm install --prefix /tmp/viaja-smoke --no-package-lock --no-audit --no-fund playwright@1.56.1
          nohup npx vite preview --config vite.portable.config.ts --host 127.0.0.1 --port 4173 > /tmp/tupa-preview.log 2>&1 &
          for i in $(seq 1 40); do if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi; sleep 1; done
          node scripts/tupa-demo-smoke.mjs
      - name: Upload browser screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tupa-Travel-Premium-Screenshots
          path: artifacts/tupa-demo/
          retention-days: 10
