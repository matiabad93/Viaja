name: Viaja — one-time approved stale-branch cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  approved-prune:
    if: github.repository == 'matiabad93/Viaja' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore(repo): execute approved cleanup of stale branches'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Delete only user-approved obsolete refs, with SHA leases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Explicit allowlist. Never touch main, security or tupa-travel-v1.
          branches=(
            'fix/viaja-tab-states-filters-ui-20261104|8be9cb18fe5c78f2005eb596654d7833ade527d2'
            'dependabot/npm_and_yarn/tailwindcss/postcss-4.3.3|3516bee581f6478a8571d001867815c71f9e8726'
            'demo/tupa-travel|'
          )
          for entry in "${branches[@]}"; do
            branch="${entry%%|*}"
            expected="${entry#*|}"
            case "$branch" in
              main|master|security/*|tupa-travel-v1)
                echo "::error::Protected ref on deletion list: $branch"
                exit 1 ;;
            esac
            actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -z "$actual" ]]; then
              echo "Already deleted: $branch"
              continue
            fi
            if [[ -n "$expected" && "$actual" != "$expected" ]]; then
              echo "::error::Ref changed since audit; will not delete $branch"
              exit 1
            fi
            echo "Deleting approved stale ref: $branch"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch" >/dev/null
          done
