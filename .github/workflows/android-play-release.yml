name: Viaja - Google Play signed AAB (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viaja-google-play-release
  cancel-in-progress: false
jobs:
  signed-aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: android-release
    env:
      VIAJA_ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.VIAJA_ANDROID_UPLOAD_KEYSTORE_B64 }}
      VIAJA_ANDROID_STORE_PASSWORD: ${{ secrets.VIAJA_ANDROID_STORE_PASSWORD }}
      VIAJA_ANDROID_KEY_ALIAS: ${{ secrets.VIAJA_ANDROID_KEY_ALIAS }}
      VIAJA_ANDROID_KEY_PASSWORD: ${{ secrets.VIAJA_ANDROID_KEY_PASSWORD }}
      VIAJA_API_BASE: https://viaja.pages.dev
      VIAJA_NATIVE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate release signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in VIAJA_ANDROID_UPLOAD_KEYSTORE_B64 VIAJA_ANDROID_STORE_PASSWORD VIAJA_ANDROID_KEY_ALIAS VIAJA_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Android release secret: $name"
              exit 1
            fi
          done
          echo 'All release signing inputs are configured'
      - name: Build connected native web assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
          npm run build:demo
          test -s web-dist/index.html
      - name: Install and sync Capacitor Android
        run: |
          npm ci --prefix mobile --ignore-scripts --no-audit --no-fund
          node scripts/restore-gradle-wrapper.mjs
          cd mobile
          npx cap sync android
      - uses: android-actions/setup-android@v4
      - name: Install Android API 36 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Decode ephemeral upload keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$VIAJA_ANDROID_UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/viaja-upload.jks"
          test -s "$RUNNER_TEMP/viaja-upload.jks"
          echo "VIAJA_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/viaja-upload.jks" >> "$GITHUB_ENV"
      - name: Build signed Android App Bundle for Play Console
        working-directory: mobile/android
        shell: bash
        env:
          VIAJA_ANDROID_VERSION_CODE: ${{ github.run_number }}
          VIAJA_ANDROID_VERSION_NAME: 1.0.0
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          test -s app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - name: Upload private signed AAB for manual Play Console release
        uses: actions/upload-artifact@v4
        with:
          name: Viaja-Play-Release-AAB
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
      - name: Erase temporary keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/viaja-upload.jks"
