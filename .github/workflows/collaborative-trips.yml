name: Viaja — collaborative trips verification
on:
  push:
    branches: [feat/collaborative-trips-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript and collaboration security contracts
        run: |
          npx tsc --noEmit
          node --experimental-strip-types tests/collaborative-trips.test.mts
          node --experimental-strip-types tests/community-trips.test.mts
          node --experimental-strip-types tests/social-auth.test.mts
      - name: Build preview without private keys
        run: |
          npm run build:demo
          test -f web-dist/index.html
      - name: Test existing travel model
        run: |
          npm run test:core
