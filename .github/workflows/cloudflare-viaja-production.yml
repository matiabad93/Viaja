name: Viaja — publicar producción en Cloudflare Pages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-viaja-production.yml'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'portable/**'
      - 'public/**'
      - 'functions/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-lock.yaml'
      - 'vite.portable.config.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viaja-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.VIAJA_CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.VIAJA_CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Comprobar credenciales sin exponerlas
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::warning::Despliegue omitido: falta el token y/o account ID de Cloudflare. Guardarlos como VIAJA_CF_API_TOKEN y VIAJA_CF_ACCOUNT_ID en GitHub Actions secrets; no pegarlos en chats ni commits."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages auth inputs present; proceeding with existing viaja project."
      - name: Compilar exactamente el cliente de Viaja
        if: steps.credentials.outputs.available == 'true'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsc --noEmit
          npm run build:demo
          test -s web-dist/index.html
          if ! grep -Rq -- 'padding-inline-start:49px' web-dist/assets/*.css; then
            echo "::error::Missing dark-mode icon spacing fix in built CSS"
            exit 1
          fi
      - name: Publicar EN EL PROYECTO EXISTENTE viaja
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler pages deploy web-dist \
            --project-name viaja \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Viaja: corrección de contraste e iconos en modo oscuro"
      - name: Verificar que Cloudflare sirva los nuevos estilos
        if: steps.credentials.outputs.available == 'true'
        run: node scripts/ui-delivery-a-live-check.mjs https://viaja.pages.dev
