name: Viaja 1.1 — Logistics Preview (no production)
on:
  push:
    branches: [feat/viaja-ui-logistics-darkmode]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'scripts/logistics-browser-smoke.mjs'
      - 'tests/logistics.test.mts'
      - '.github/workflows/viaja-logistics-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: viaja-logistics-preview
  cancel-in-progress: true
jobs:
  verified-preview:
    runs-on: ubuntu-24.04
    environment: preview
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.VIAJA_CF_PREVIEW_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.VIAJA_CF_PREVIEW_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify configuration and install dependencies
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Cloudflare credentials required for Preview. No deployment performed."
            exit 1
          fi
          npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript, regressions and reservation tests
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npm run test:core
          node --experimental-strip-types tests/logistics.test.mts
          node --experimental-strip-types tests/collaborative-trips.test.mts
          node --experimental-strip-types tests/community-trips.test.mts
      - name: Build preview
        run: |
          npm run build:demo
          test -s web-dist/index.html
      - name: Prepare Chromium UI tests
        run: |
          command -v google-chrome
          npm install --prefix /tmp/viaja-ui-smoke --no-package-lock --no-audit --no-fund playwright@1.56.1
      - name: Start local compiled preview
        run: |
          nohup npx vite preview --config vite.portable.config.ts --host 127.0.0.1 --port 4173 > /tmp/viaja-preview.log 2>&1 &
          for n in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/viaja-preview.log
          exit 1
      - name: Audit logistics on 320/390/768/1280px
        run: node scripts/logistics-browser-smoke.mjs
      - name: Install WebKit for Safari-engine regression checks
        run: /tmp/viaja-ui-smoke/node_modules/.bin/playwright install --with-deps webkit
      - name: Audit Safari WebKit logistics UI on mobile, tablet and desktop
        env:
          VIAJA_BROWSER: webkit
        run: node scripts/logistics-browser-smoke.mjs
      - name: Deploy only the feature branch to the existing Cloudflare Pages project
        run: |
          npx wrangler pages deploy web-dist \
            --project-name viaja \
            --branch feat/viaja-ui-logistics-darkmode \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "Viaja 1.1: Logistics preview"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Viaja-Logistics-Preview-QA
          path: artifacts/logistics-b/
          retention-days: 7
